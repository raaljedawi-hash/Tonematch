<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TONE MATCH</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF8FF;--bg2:#F5FBFF;--ice:#DFF4FF;--pas:#B8E3F8;--sky:#89CFF0;--navy:#315B78;--card:#FFFFFF;--bd:#DCEBF4;--tx:#233C4D;--sub:#6F8798;--ok:#6FAF91;--err:#D96C78;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',system-ui,sans-serif}
#app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media(min-width:500px){body{background:#F5FBFF}#app{height:min(100%,860px);margin-top:max(0px,calc((100% - 860px)/2));border-radius:34px;box-shadow:0 20px 60px #315b7840}}
.scr{flex:1;overflow-y:auto;padding:18px 18px 24px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
h1,h2,h3,p{margin:0}h2{font-size:22px;font-weight:800;color:var(--navy)}h3{font-size:16px;font-weight:700;color:var(--navy);margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px #89cff026}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;font:700 16px Tajawal,system-ui;background:var(--sky);color:var(--tx);margin-top:10px;cursor:pointer;transition:transform .15s}.btn:active{transform:scale(.97)}
.btn.d{background:var(--navy);color:#fff}.btn.g{background:var(--card);color:var(--navy);border:1px solid var(--bd)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}.back{background:var(--card);border:1px solid var(--bd);border-radius:14px;width:38px;height:38px;color:var(--navy);font-size:18px;cursor:pointer}
.chip{display:block;width:100%;text-align:right;background:var(--ice);border:1.5px solid var(--bd);border-radius:16px;padding:14px;margin-top:8px;font:500 16px Tajawal,system-ui;color:var(--tx);cursor:pointer;transition:.2s}.chip.on{background:var(--pas);border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);font-weight:700}
.bar{height:8px;background:var(--card);border:1px solid var(--bd);border-radius:6px;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--sky);border-radius:6px;transition:width .3s}
input{width:100%;background:var(--ice);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:10px;font:16px Tajawal,system-ui;color:var(--tx);text-align:right}
.nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding:8px 4px 10px}.nav button{flex:1;background:none;border:0;color:var(--sub);font:500 10.5px Tajawal;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}.nav button.on{color:var(--navy);font-weight:800}.nav svg{width:22px;height:22px}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.sw{width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);flex:none}.grow{flex:1}.sub{color:var(--sub);font-size:13px}.hex{font-size:12px;color:var(--sub);direction:ltr;cursor:pointer}
.heart{background:none;border:0;font-size:22px;color:var(--navy);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{text-align:center;font-size:12px}.tile .sw{width:100%;height:62px;margin-bottom:4px;border-radius:16px;cursor:pointer}
.hero{text-align:center;padding:40px 10px 10px}.logo{font-size:36px;font-weight:800;letter-spacing:5px;color:var(--navy);direction:ltr}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)}.kv b{color:var(--navy)}
.pill{display:inline-block;background:var(--pas);color:var(--navy);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;display:inline-block;margin:4px}
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;font-weight:700;box-shadow:0 6px 18px #233c4d33}.toast.e{background:var(--err)}.toast{color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;animation:in .3s}
.note{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.7}
.spin{width:70px;height:70px;border-radius:50%;border:6px solid var(--ice);border-top-color:var(--sky);animation:sp 1s linear infinite;margin:0 auto 20px}@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body><div id="app"></div>
<script>
const $=document.getElementById('app');
const Q=[['hair','لون شعرك الطبيعي',['أسود','بني غامق','بني فاتح','أشقر','كستنائي']],['eyes','لون عينيك',['بني غامق','بني فاتح','عسلي','أخضر','أزرق/رمادي']],['skin','درجة بشرتك',['فاتحة','متوسطة','حنطية/عميقة']],['metal','أي معدن يبدو أجمل عليك؟',['الذهبي','الفضي','كلاهما','لا أعرف']],['goal','هدفك من التحليل',['الملابس','المكياج','الإكسسوارات','الكل']]];
const PAL={'ربيع':[['مرجاني','#FF7F6E'],['خوخي','#FFB38A'],['أخضر تفاحي','#9ACD5A'],['تركواز دافئ','#3FB8AF'],['أصفر زبدي','#F7DC8A'],['كاميل','#C69C6D']],'صيف':[['وردي غباري','#D8A7B1'],['لافندر','#B6A6D8'],['أزرق سماوي','#89CFF0'],['مريمية','#9DB8A0'],['توت هادئ','#A5557A'],['رمادي ناعم','#9AA5B1']],'خريف':[['تيراكوتا','#C0643C'],['زيتوني','#7A7A3A'],['خردلي','#D6A02B'],['بني دافئ','#8B5A3C'],['أخضر غابات','#3F5F3A'],['قرميدي','#A5402D']],'شتاء':[['أزرق ملكي','#2B4C9B'],['فوشيا','#C2185B'],['زمردي','#0B7A5A'],['أحمر صافٍ','#C8102E'],['بنفسجي','#5B2A86'],['أسود مزرق','#1B2430']]};
const NE={'دافئ':[['عاجي','#F3EAD7'],['بيج','#D8C3A5'],['بني فاتح','#A67B5B']],'بارد':[['أبيض ثلجي','#F4F8FB'],['رمادي','#B8C2CC'],['كحلي','#26364F']],'محايد':[['أوف وايت','#F5F1EA'],['توب','#B5A596'],['فحمي','#3A3F47']]};
const MK={'دافئ':[['أحمر الشفاه','مرجاني قرميدي','#D9624A'],['بلاشر','خوخي','#F4A37F'],['ظلال العيون','برونزي ذهبي','#B98B4E'],['برونزر','كراميل','#C08A5A'],['هايلايتر','ذهبي شامبانيا','#F2D9A6']],'بارد':[['أحمر الشفاه','وردي توتي','#B8456E'],['بلاشر','وردي بارد','#E58FA9'],['ظلال العيون','رمادي بنفسجي','#8E86A8'],['برونزر','تاوب بارد','#A98B7E'],['هايلايتر','لؤلؤي فضي','#E6E9F2']],'محايد':[['أحمر الشفاه','وردي ترابي','#C46A6F'],['بلاشر','خوخي وردي','#EBA0A0'],['ظلال العيون','موف بني','#9A7B78'],['برونزر','بيج محايد','#B88F6E'],['هايلايتر','شامبانيا وردي','#EFD8D0']]};
const MT={'الذهبي':['linear-gradient(135deg,#F6E27A,#C9A227)','يبرز الدفء. جميل مع الأبيض والزيتوني.'],'الفضي':['linear-gradient(135deg,#F2F5F8,#9AA5B1)','نضارة باردة. جميل مع الكحلي والرمادي.'],'الروز غولد':['linear-gradient(135deg,#F4C9BC,#C98B7B)','خيار وسطي يناسب أغلب الدرجات.'],'المختلط':['linear-gradient(135deg,#F6E27A,#C0C7CE,#E0A899)','اجمعي معدنين بنسبة غير متساوية.']};
const S={scr:'welcome',q:0,ans:{},res:null,favs:[],looks:[],sel:[],tab:'report',prog:0,name:'ضيفة',photo:null,toast:'',terr:0,lname:''};
const nav=(s,t)=>{S.scr=s;if(t)S.tab=t;draw()};
function analyze(a){const u=a.metal==='الذهبي'?'دافئ':a.metal==='الفضي'?'بارد':a.metal==='كلاهما'?'محايد':'غير محدد',k=u==='غير محدد'?'محايد':u;
const depth=a.skin==='فاتحة'?'فاتح':a.skin==='متوسطة'?'متوسط':'عميق',dh=['أسود','بني غامق'].includes(a.hair),le=['أخضر','أزرق/رمادي'].includes(a.eyes);
const con=dh&&(depth==='فاتح'||le)?'مرتفع':(!dh&&depth==='فاتح')?'منخفض':'متوسط';
const se=k==='دافئ'?(depth==='فاتح'?'ربيع':'خريف'):k==='بارد'?(depth==='عميق'||con==='مرتفع'?'شتاء':'صيف'):(con==='مرتفع'?'شتاء':depth==='فاتح'?'صيف':'خريف');
return{u,k,depth,con,se,nat:['ربيع','شتاء'].includes(se)?'صافية':'هادئة',conf:u==='غير محدد'?'منخفضة':'متوسطة'}}
const heart=h=>S.favs.includes(h)?'♥':'♡';
const toast=(m,e)=>{S.toast=m;S.terr=e?1:0;draw();setTimeout(()=>{S.toast='';draw()},1600)};
const fig=c=>`<svg viewBox="0 0 120 170" width="120" height="170"><circle cx="60" cy="18" r="13" fill="#E9C9B0"/><rect x="38" y="34" width="44" height="52" rx="14" fill="${c[0]||'#DFF4FF'}"/><path d="M40 84h40l12 60H28z" fill="${c[1]||'#DFF4FF'}"/><rect x="48" y="34" width="24" height="9" rx="4" fill="${c[2]||'#B8E3F8'}"/><rect x="30" y="148" width="22" height="9" rx="4" fill="${c[3]||'#DFF4FF'}"/><rect x="68" y="148" width="22" height="9" rx="4" fill="${c[3]||'#DFF4FF'}"/></svg>`;
const sw=(n,h,x='')=>`<div class="row"><div class="sw" style="background:${h}" data-a="copy" data-v="${h}"></div><div class="grow"><b>${n}</b><div class="hex" data-a="copy" data-v="${h}">${h}</div></div>${x}</div>`;
const fv=h=>`<button class="heart" data-a="fav" data-v="${h}">${heart(h)}</button>`;
const hd=(t,b)=>`<div class="top">${b?`<button class="back" data-a="${b==='back'?'back':'go'}" data-v="${b}">›</button>`:''}<h2>${t}</h2></div>`;
const ic={report:'<path d="M12 3a9 9 0 100 18 4 4 0 000-8 4 4 0 010-8z"/>',makeup:'<path d="M9 3h6v6l-1 2v10h-4V11L9 9z"/>',acc:'<circle cx="12" cy="14" r="6"/><path d="M9 6l3-3 3 3"/>',out:'<path d="M8 4l4 2 4-2 5 4-3 3-2-1v10H8V10l-2 1-3-3z"/>',fav:'<path d="M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z"/>'};
const tabs=[['report','التقرير'],['makeup','المكياج'],['acc','الإكسسوار'],['out','الملابس'],['fav','حسابي']];
function main(){const r=S.res,t=S.tab;let c='';
if(t==='report')c=`${hd('تقريرك الشخصي')}<div class="card" style="background:linear-gradient(135deg,var(--pas),var(--ice));text-align:center"><span class="pill">نتيجة تجريبية</span><h1 style="font-size:34px;font-weight:800;color:var(--navy);margin:8px 0 2px">${r.se}</h1><p class="sub">ألوان ${r.nat} · ${r.u==='غير محدد'?'اندرتون غير محدد':'اندرتون '+r.u}</p></div>
<div class="card">${[['الاندرتون',r.u],['عمق اللون',r.depth],['طبيعة الألوان',r.nat],['مستوى التباين',r.con],['الموثوقية',r.conf]].map(x=>`<div class="kv"><span class="sub">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
<div class="card"><h3 style="margin-top:0">لوحتك (اضغطي لنسخ الكود)</h3><div class="grid">${PAL[r.se].map(p=>`<div class="tile"><div class="sw" style="background:${p[1]}" data-a="copy" data-v="${p[1]}"></div>${p[0]}<br>${fv(p[1])}</div>`).join('')}</div></div>
<div class="card"><h3 style="margin-top:0">لماذا هذه النتيجة؟</h3><p class="note" style="margin:0">الاندرتون من المعدن الذي اخترتِه، والعمق من وصفك للبشرة، والتباين من الشعر والعينين. ${r.u==='غير محدد'?'المعلومات غير كافية، جرّبي ورقة بيضاء وأخرى كريمية بجانب وجهك بضوء النهار.':''}<br>هذه بيانات ونتائج تجريبية وليست تحليل ذكاء اصطناعي حقيقي، والإضاءة والكاميرا تؤثران على أي قراءة صور.</p></div>
<button class="btn g" data-a="go" data-v="quiz0">إعادة التحليل وتعديل الإجابات</button>`;
else if(t==='makeup')c=`${hd('توصيات المكياج')}<div class="card">${MK[r.k].map(m=>sw(m[0]+' · '+m[1],m[2],fv(m[2]))).join('')}<p class="note">أكواد HEX تقريبية وليست بالضرورة مطابقة لدرجات منتجات تجارية.</p></div>`;
else if(t==='acc'){const o=r.k==='دافئ'?['الذهبي','الروز غولد','المختلط','الفضي']:r.k==='بارد'?['الفضي','الروز غولد','المختلط','الذهبي']:['المختلط','الروز غولد','الذهبي','الفضي'];
c=`${hd('الإكسسوارات والمعادن')}${o.map((m,i)=>`<div class="card"><div class="row" style="border:0"><div class="sw" style="width:56px;height:56px;border-radius:50%;background:${MT[m][0]}"></div><div class="grow"><b>${m}</b> <span class="pill">${i<2?'الأنسب':'أحيانًا'}</span><div class="sub">${MT[m][1]}</div></div></div></div>`).join('')}`}
else if(t==='out'){const p=PAL[r.se],n=NE[r.k],all=[...p,...n];const ready=[['يومية',[n[0][1],p[2][1],p[0][1],n[1][1]]],['رسمية',[n[2][1],n[0][1],p[4][1],n[2][1]]],['مناسبات',[p[1][1],p[5][1],p[3][1],n[1][1]]]];
c=`${hd('الملابس والإطلالات')}<h3 style="margin-top:0">إطلالات جاهزة</h3><div class="grid">${ready.map(l=>`<div class="card tile" style="padding:8px;cursor:pointer" data-a="load" data-v="${l[1].join(',')}">${fig(l[1])}<br><b>${l[0]}</b></div>`).join('')}</div>
<div class="card"><h3 style="margin-top:0">منسّق الإطلالات</h3><p class="sub">اختاري: أساسي، ثانوي، مميز، محايد (${S.sel.length}/4)</p><div style="text-align:center;margin:8px 0">${all.map(x=>`<span class="dot" style="background:${x[1]}" data-a="pick" data-v="${x[1]}"></span>`).join('')}</div><div style="text-align:center">${fig(S.sel)}</div>
<input id="ln" placeholder="اسم الإطلالة" value="${S.lname}"><button class="btn" data-a="savelook">حفظ الإطلالة</button><button class="btn g" data-a="clr">مسح</button></div>`}
else c=`${hd('حسابي والمفضلة')}<div class="card row" style="border:0"><div class="sw" style="border-radius:50%;background:var(--pas)"></div><div class="grow"><b>${S.name}</b><div class="sub">حساب تجريبي · ${S.res.se}</div></div></div>
<div class="card"><h3 style="margin-top:0">ألوان محفوظة</h3>${S.favs.length?S.favs.map(h=>sw(h,h,fv(h))).join(''):'<p class="sub">اضغطي ♡ على أي لون ليظهر هنا.</p>'}</div>
<div class="card"><h3 style="margin-top:0">إطلالات محفوظة</h3>${S.looks.length?S.looks.map((l,i)=>`<div class="row"><div>${fig(l.c).replace('width="120" height="170"','width="44" height="62"')}</div><div class="grow"><b>${l.n}</b></div><button class="heart" data-a="del" data-v="${i}">🗑</button></div>`).join(''):'<p class="sub">لا توجد إطلالات بعد.</p>'}</div>
<div class="card"><h3 style="margin-top:0">الخصوصية</h3><p class="note" style="margin:0">هذا نموذج تفاعلي: لا يُرسل أي بيانات ولا يحفظ صورك. الصور تُعرض على جهازك فقط.</p></div><button class="btn g" data-a="go" data-v="welcome">تسجيل الخروج</button>`;
return`<div class="scr" key="${t}">${c}</div><div class="nav">${tabs.map(x=>`<button class="${t===x[0]?'on':''}" data-a="tab" data-v="${x[0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">${ic[x[0]]}</svg>${x[1]}</button>`).join('')}</div>`}
function view(){const s=S.scr;
if(s==='welcome')return`<div class="scr"><div class="hero" style="padding-top:28px"><div style="width:116px;height:116px;border-radius:50%;margin:0 auto 20px;background:conic-gradient(#B8E3F8,#FFB38A,#D8A7B1,#9DB8A0,#89CFF0,#B8E3F8);display:grid;place-items:center;box-shadow:0 10px 30px #89cff066"><div style="width:80px;height:80px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:30px">✨</div></div><div class="logo">TONE MATCH</div><h2 style="font-size:24px;margin:16px 0 8px">اكتشفي ألوانك، بطريقتك</h2><p class="sub" style="font-size:15px;line-height:1.8;padding:0 10px">حلّلي درجة بشرتك واحصلي على لوحة ألوان شخصية، ومكياج وإكسسوارات وملابس تناسبك.</p></div><div class="grid" style="margin:22px 0">${[['🎨','لوحتك'],['💄','المكياج'],['💍','المعادن']].map(x=>`<div class="card tile" style="padding:14px 6px;margin:0;background:var(--bg2)"><div style="font-size:26px">${x[0]}</div><b>${x[1]}</b></div>`).join('')}</div><button class="btn" data-a="go" data-v="login" style="background:var(--navy);color:#fff">ابدئي رحلتك</button><p class="note" style="text-align:center">نموذج تجريبي · النتائج ليست تحليل ذكاء اصطناعي حقيقي</p></div>`;
if(s==='login')return`<div class="scr">${hd('أهلًا بك','welcome')}<div class="card"><p class="sub">حساب تجريبي، لا يتم حفظ أي بيانات.</p><input id="nm" placeholder="الاسم" value=""><input placeholder="البريد الإلكتروني" dir="ltr"><input type="password" placeholder="كلمة المرور" dir="ltr"><button class="btn d" data-a="login">تسجيل الدخول</button><button class="btn g" data-a="guest">المتابعة كزائرة</button></div></div>`;
if(s==='quiz'){const q=Q[S.q];return`<div class="scr">${hd('الاستبيان '+(S.q+1)+'/'+Q.length,'back')}<div class="bar"><i style="width:${(S.q+1)/Q.length*100}%"></i></div><div class="card"><h3 style="margin-top:0;font-size:19px">${q[1]}</h3>${q[2].map(o=>`<button class="chip ${S.ans[q[0]]===o?'on':''}" data-a="ans" data-v="${o}">${o}</button>`).join('')}</div><button class="btn" data-a="next">${S.q<Q.length-1?'التالي':'متابعة'}</button></div>`}
if(s==='photo')return`<div class="scr">${hd('صورة البشرة','quiz4')}<div class="card" style="text-align:center">${S.photo?`<img src="${S.photo}" style="width:100%;height:210px;object-fit:cover;border-radius:18px">`:'<div style="height:150px;border-radius:18px;background:linear-gradient(135deg,var(--bg2),var(--pas));display:grid;place-items:center;font-size:44px">📷</div>'}<p class="note">الصورة اختيارية وتبقى على جهازك فقط، ولا تدخل في التحليل في هذا النموذج.</p></div><label class="btn" style="text-align:center;cursor:pointer">التقاط أو اختيار صورة<input type="file" accept="image/*" id="f" hidden></label>${S.photo?'<button class="btn g" data-a="rmphoto">حذف الصورة</button>':''}<button class="btn g" data-a="demo">تجربة تحليل افتراضي</button><button class="btn" data-a="run">${S.photo?'تحليل':'تخطي وتحليل'}</button></div>`;
if(s==='wait'){const st=S.prog<35?'قراءة إجاباتك…':S.prog<70?'مطابقة الاندرتون والعمق…':'بناء لوحتك…';return`<div class="scr" style="display:grid;place-items:center;text-align:center"><div><div class="spin"></div><h2>${st}</h2><div class="bar" style="width:240px;margin:16px auto"><i style="width:${S.prog}%"></i></div><p class="sub">${S.prog}%</p></div></div>`}
return main()}
function draw(){$.innerHTML=view()+(S.toast?`<div class="toast ${S.terr?'e':''}">${S.toast}</div>`:'');const f=$.querySelector('#f');if(f)f.onchange=e=>{const x=e.target.files[0];if(x){S.photo=URL.createObjectURL(x);draw()}}}
function run(){S.scr='wait';S.prog=0;draw();const t=setInterval(()=>{S.prog+=5;if(S.prog>=100){clearInterval(t);S.res=analyze(S.ans);nav('main','report')}else draw()},150)}
$.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==='go'){if(v==='quiz0'){S.q=0;return nav('quiz')}if(v==='quiz4'){S.q=4;return nav('quiz')}return nav(v)}
if(a==='login'){S.name=(document.querySelector('#nm').value||'ضيفة');return nav('quiz',S.q=0)}
if(a==='guest'){S.name='ضيفة';S.q=0;return nav('quiz')}
if(a==='back'){if(S.q>0){S.q--;return draw()}return nav('login')}
if(a==='ans'){S.ans[Q[S.q][0]]=v;return draw()}
if(a==='next'){if(!S.ans[Q[S.q][0]])return toast('اختاري إجابة',1);if(S.q<Q.length-1){S.q++;return draw()}return nav('photo')}
if(a==='demo'){S.ans={hair:'بني غامق',eyes:'عسلي',skin:'متوسطة',metal:'الذهبي',goal:'الكل'};return run()}
if(a==='run'){const m=Q.find(q=>!S.ans[q[0]]);if(m){S.q=Q.indexOf(m);return nav('quiz')}return run()}
if(a==='rmphoto'){S.photo=null;return draw()}
if(a==='tab')return nav('main',v);
if(a==='copy'){try{await navigator.clipboard.writeText(v)}catch(_){}return toast('تم نسخ '+v)}
if(a==='fav'){S.favs=S.favs.includes(v)?S.favs.filter(x=>x!==v):[...S.favs,v];return draw()}
if(a==='pick'){if(S.sel.length<4)S.sel.push(v);return draw()}
if(a==='clr'){S.sel=[];return draw()}
if(a==='load'){S.sel=v.split(',');return draw()}
if(a==='savelook'){const n=document.querySelector('#ln').value.trim();if(S.sel.length<4||!n)return toast('اختاري 4 ألوان واكتبي اسمًا',1);S.looks.push({n,c:[...S.sel]});S.sel=[];return toast('تم حفظ الإطلالة')}
if(a==='del'){S.looks.splice(+v,1);draw()}});
draw();
</script></body></html>
